      <stop offset="1" stop-color="#E8F0FF"/>
    </linearGradient>

    <filter id="ac_shadow2" x="10" y="8" width="78" height="80" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#315AE6" flood-opacity="0.20"/>
    </filter>
  </defs>

  <g filter="url(#ac_shadow2)">
    <rect x="18" y="14" width="60" height="60" rx="18" fill="url(#ac_bg2)"/>
  </g>

  <!-- gift lid -->
  <rect x="31" y="30" width="30" height="8" rx="4" fill="url(#ac_lid)"/>

  <!-- gift box -->
