<svg width="60" height="60" viewBox="18 14 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ac_bg2" x1="18" y1="14" x2="78" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FA6FF"/>
      <stop offset="1" stop-color="#4C74FF"/>
    </linearGradient>

    <linearGradient id="ac_box" x1="30" y1="32" x2="60" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE7FF"/>
