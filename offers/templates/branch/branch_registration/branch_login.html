{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Branch · OTP Login</title>
  <script src="{% static 'offers/js/api-guard.js' %}"></script>
  <link rel="stylesheet" href="{% static 'offers/css/ui/button_loading.css' %}">
  <script src="{% static 'offers/js/ui/button_loading.js' %}"></script>
  <link rel="stylesheet" href="{% static 'offers/css/ui/interaction_blocker.css' %}">
  <script src="{% static 'offers/js/ui/interaction_blocker.js' %}"></script>
  <link rel="stylesheet" href="{% static 'offers/css/ui/page_loading.css' %}">
  <script src="{% static 'offers/js/ui/page_loading.js' %}"></script>
  
<style>
  :root{
    --bg:#0b1020;
    --card:#11183a;
    --border:#273164;
    --text:#e8ecff;
    --muted:#b9c4ff;
    --prim:#4c74ff;
    --ok:#a7ffb5;
    --err:#ffb3b3;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    font-family:system-ui,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  .lg-wrap{
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:20px;
  }

  .lg-card{
    width:min(420px, 100%);
    margin-inline:auto;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 18px 16px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }

  h1{
    margin:0 0 12px;
    font-size:18px;
  }

  .lg-hint{
    color:var(--muted);
    font-size:13px;
    margin:-6px 0 14px;
  }

  label{
    display:block;
    margin:10px 0 6px;
    font-size:14px;
  }

  input,
  button,
  select{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0f1540;
    color:var(--text);
    transition:border-color .15s;
  }

  input::placeholder{
    color:#9fb0ff99;
  }

  .lg-row{
    display:flex;
    gap:10px;
  }

  .lg-row > *{
    flex:1;
    min-width:0;
  }

  .lg-btn{
    background:var(--prim);
    border-color:transparent;
    font-weight:700;
    cursor:pointer;
  }

  .lg-btn[disabled]{
    opacity:.6;
    cursor:not-allowed;
  }

  .lg-otp-row{
    display:grid;
    grid-template-columns:minmax(0, 1fr) 136px;
    gap:10px;
    align-items:stretch;
  }

  .lg-otp-row > *{
    min-width:0;
  }

  #lgBtnGetOtp{
    width:136px;
    min-width:136px;
    max-width:136px;
    padding-inline:10px;
  }

  #lgBtnGetOtp .oz-btn__content,
  #lgBtnGetOtp .oz-btn__loading{
    width:100%;
    justify-content:center;
    gap:8px;
    text-align:center;
    white-space:nowrap;
  }

  .lg-msg{
    margin:10px 0 12px;
    font-size:13px;
    color:#b9c4ff;
  }

  .lg-err{color:#ffb3b3}
  .lg-ok{color:#a7ffb5}

  .lg-field-hint{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:6px;
    font-size:12px;
    color:var(--muted);
  }

  .lg-staff-msg {
  margin: 8px 0 0;
  color: var(--err);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.35;
}

.lg-staff-msg[hidden] {
  display: none;
}

  .lg-chip{
    display:inline-block;
    padding:2px 8px;
    border-radius:999px;
    border:1px solid var(--border);
    font-size:11px;
  }

  .lg-chip.ok{
    border-color:#2f7;
    color:#9f9;
  }

  .lg-chip.err{
    border-color:#f77;
    color:#ffb3b3;
  }

  .lg-is-ok{border-color:#2f7 !important}
  .lg-is-err{border-color:#f77 !important}

  .lg-lockwrap{
    position:relative;
  }

  .lg-lockwrap .lg-lockicon{
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    opacity:.85;
    pointer-events:none;
  }

  .lg-lockwrap input{
    padding-left:34px;
  }

  #lgIdentifier{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
</style>

</head>
<body>
<div class="lg-wrap">
  <form class="lg-card" id="lgBranchOtpForm" onsubmit="return false;">
    <h1>Branch OTP</h1>
    <div class="lg-hint">Enter branch name and get OTP to sign in.</div>

    <label for="lgBranchName">Branch name</label>
    <input
      id="lgBranchName"
      name="branch"
      type="text"
      placeholder="e.g., madhapura1"
      required
      pattern="[a-z0-9]+"
      title="Only lowercase letters and numbers. No spaces."
    >

    <div class="lg-field-hint">
      <span class="lg-chip" id="lgBranchChip">Not checked</span>
      <small id="lgBranchMsg">Type to check…</small>
    </div>
        <div id="lgMsg" class="lg-msg" role="status" aria-live="polite"></div>


    <div style="margin-top:8px">
      <label for="lgLoginFor">Login for</label>
      <select id="lgLoginFor" name="login_for">
        <option value="branch" selected>Branch main account</option>
      </select>

      <div
        id="lgStaffMsg"
        class="lg-staff-msg"
        role="status"
        aria-live="polite"
        hidden
      ></div>
    </div>

    <div class="lg-row" style="margin-top:8px">
      <div>
        <label for="lgLoginTarget">Send OTP to</label>
        <select id="lgLoginTarget" name="target" disabled>
          <option value="email" selected>Email</option>
          <option value="phone" disabled>Phone (disabled)</option>
        </select>
      </div>

      <div>
        <label for="lgIdentifier">Email (locked)</label>
        <div class="lg-lockwrap">
          <span class="lg-lockicon">🔒</span>
          <input
            id="lgIdentifier"
            name="identifier"
            type="text"
            placeholder="mail@branch.com"
            readonly
          >
        </div>
      </div>
    </div>

    <label for="lgOtp" style="margin-top:8px">OTP</label>
    <div class="lg-otp-row">
      <input
        id="lgOtp"
        name="otp"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        placeholder="Enter OTP"
        maxlength="6"
        required
      >

      <button
        type="button"
        id="lgBtnGetOtp"
        class="lg-btn oz-btn-inline-flex"
        disabled
      >
        <span class="oz-btn__content">Get OTP</span>
        <span class="oz-btn__loading">
          {% include "ui_states/spinners/button_loading.html" %}
          <span>Sending</span>
        </span>
      </button>
    </div>

    <button
      type="submit"
      id="lgBtnVerify"
      class="lg-btn oz-btn-inline-flex"
      style="margin-top:10px"
      disabled
    >
      <span class="oz-btn__content">Verify &amp; Continue</span>
      <span class="oz-btn__loading">
        {% include "ui_states/spinners/button_loading.html" %}
        <span>Verifying...</span>
      </span>
    </button>


    <div style="margin-top:12px; display:flex; justify-content:space-between; gap:12px;">
      <a href="{% url 'offers:user_login' %}" id="link-user">User Login</a>
      <a href="{% url 'offers:admin_login' %}" id="link-admin">Admin sign-in</a>
    </div>
  </form>
</div>

<div id="ozInteractionBlocker" hidden aria-hidden="true"></div>

{% include "ui_states/errors/global_toast.html" %}
{% include "ui_states/spinners/page_loader.html" %}    


<script>
(() => {
  const OTP_SEND_URL     = "{% url 'offers:branch_otp_send' %}";
  const OTP_VERIFY_URL   = "{% url 'offers:branch_otp_verify' %}";
  const BRANCH_CHECK_URL = "{% url 'offers:branch_check' %}";
  const COOLDOWN_SECS    = 60;

  const form       = document.getElementById('lgBranchOtpForm');
  const branchEl   = document.getElementById('lgBranchName');
  const idEl       = document.getElementById('lgIdentifier');
  const otpEl      = document.getElementById('lgOtp');
  const getBtn     = document.getElementById('lgBtnGetOtp');
  const verifyBtn  = document.getElementById('lgBtnVerify');
  const msgEl      = document.getElementById('lgMsg');
  const branchChip = document.getElementById('lgBranchChip');
  const branchMsg  = document.getElementById('lgBranchMsg');
  const loginForEl = document.getElementById('lgLoginFor');
  const staffMsgEl = document.getElementById('lgStaffMsg');
  const linkUser   = document.getElementById('link-user');
  const linkAdmin  = document.getElementById('link-admin');

  const sanitizeBranch = v =>
    (v || '').toLowerCase().replace(/\s+/g, '').replace(/[^a-z0-9]/g, '');

  const validBranch = v => /^[a-z0-9]+$/.test(v);

  function sanitizeOtp(value){
    return (value || '').replace(/\D/g, '').slice(0, 6);
  }

  function setGetOtpLabel(text){
    const contentEl = getBtn?.querySelector('.oz-btn__content');
    if (contentEl) {
      contentEl.textContent = text;
    } else if (getBtn) {
      getBtn.textContent = text;
    }
  }

  function maskEmail(email){
    if (!email) return '';
    const parts = String(email).split('@');
    if (parts.length !== 2) return email;
    const user = parts[0];
    const domain = parts[1];
    const keep = user.slice(-6);
    return '......' + keep + '@' + domain;
  }

  function lockEmail(email) {
    if (email) {
      idEl.dataset.real = email;
      idEl.value = maskEmail(email);
    } else {
      idEl.dataset.real = '';
      idEl.value = '';
    }
    idEl.readOnly = true;
  }

  function populateLoginFor(staffList, branchEmail) {
    if (!loginForEl) return;

    loginForEl.innerHTML = "";

    const optBranch = document.createElement("option");
    optBranch.value = "branch";
    optBranch.textContent = "Branch main account";
    optBranch.dataset.email = branchEmail || "";
    optBranch.selected = true;
    loginForEl.appendChild(optBranch);

    if (Array.isArray(staffList) && staffList.length) {
      for (const s of staffList) {
        if (!s.staff_id) continue;
        const opt = document.createElement("option");
        opt.value = s.staff_id;
        opt.textContent = `${s.staff_id} · ${s.name}`;
        opt.dataset.email = s.email || "";
        loginForEl.appendChild(opt);
      }
    } else {
      const optInfo = document.createElement("option");
      optInfo.value = "";
      optInfo.textContent = "No staff IDs yet";
      optInfo.disabled = true;
      loginForEl.appendChild(optInfo);
    }
  }

  function showMsg(text, type = ''){
    msgEl.textContent = text;
    msgEl.className = 'lg-msg ' + (type || '');
  }


  function showStaffLoginError(message){
    if (!staffMsgEl) return;

    staffMsgEl.textContent = message || '';
    staffMsgEl.hidden = !message;
  }

  function clearStaffLoginError(){
    showStaffLoginError('');
  }
  
  function clearInlinePageError(){
    showMsg('');
  }

  function showInlinePageError(message){
    showMsg(message || 'No internet connection. Please check your network.', 'lg-err');
  }

  function hideGlobalError(){
    const pairs = [
      ['globalError', 'globalErrorText'],
      ['apiGlobalError', 'apiErrorText'],
      ['commonError', 'commonErrorText'],
      ['scanPopup', 'scanPopMsg']
    ];

    for (const [wrapId, textId] of pairs) {
      const wrap = document.getElementById(wrapId);
      const text = document.getElementById(textId);
      if (text) text.textContent = '';
      if (wrap) wrap.hidden = true;
    }
  }

  function showGlobalOnly(message) {
    clearInlinePageError();

    const msg = message || 'You are offline. Please reconnect to continue.';

    if (window.ApiGuard?.presentError) {
      window.ApiGuard.presentError(msg);
      return;
    }

    alert(msg);
  }

  function showInteractionBlocker() {
    window.OZInteractionBlocker?.show();
  }

  function hideInteractionBlocker() {
    window.OZInteractionBlocker?.hide();
  }

  function showPageLoader(text) {
    window.OZPageLoader?.show(text || 'Loading...');
  }

  function hidePageLoader() {
    window.OZPageLoader?.hide();
  }

  function setOtpInputEnabled(enabled){
    otpEl.disabled = !enabled;
    if (!enabled) otpEl.blur();
  }

  function isBranchReady(){
    return branchChip.textContent === 'Branch found' && !!idEl.dataset.real;
  }

  let otpRequestInFlight = false;
  let verifyRequestInFlight = false;
  let otpSent = false;
  let cooldownTimer = null;
  let remaining = 0;

  function updateGetOtpButtonState(){
    const online = navigator.onLine;
    const branchReady = isBranchReady();
    const cooling = !!cooldownTimer;

    getBtn.disabled = !(
      online &&
      branchReady &&
      !cooling &&
      !otpRequestInFlight
    );
  }

  function updateVerifyButtonState(){
    const branchOk = isBranchReady();
    const otpOk = /^\d{6}$/.test(sanitizeOtp(otpEl.value));

    verifyBtn.disabled = !(
      navigator.onLine &&
      branchOk &&
      otpSent &&
      !otpRequestInFlight &&
      !verifyRequestInFlight &&
      otpOk
    );
  }

  function refreshActionStates(){
    updateGetOtpButtonState();
    updateVerifyButtonState();
  }

  function clearCooldown(){
    if (cooldownTimer) {
      clearInterval(cooldownTimer);
      cooldownTimer = null;
    }
    updateGetOtpButtonState();
  }

  function startCooldown(){
    clearCooldown();
    remaining = COOLDOWN_SECS;
    tick();
    cooldownTimer = setInterval(tick, 1000);

    function tick(){
      getBtn.disabled = true;
      setGetOtpLabel(`Resend ${remaining}s`);

      if (--remaining < 0){
        clearInterval(cooldownTimer);
        cooldownTimer = null;
        setGetOtpLabel('Get OTP');
        updateGetOtpButtonState();
      }
    }
  }

  function resetOtpUi(){
    otpSent = false;
    otpRequestInFlight = false;
    verifyRequestInFlight = false;
    otpEl.value = '';
    setOtpInputEnabled(false);
    hideInteractionBlocker();
    hidePageLoader();
    if (window.OZButtons?.stop) {
      window.OZButtons.stop(getBtn, { keepWidth: true });
      window.OZButtons.stop(verifyBtn, { keepWidth: true });
    }
    refreshActionStates();
  }

  function handleProtectedNav(link){
    if (!link) return;

    link.addEventListener('click', function (e) {
      if (e.defaultPrevented) return;

      const href = link.getAttribute('href') || '';

      if (!href || href === '#' || href.startsWith('#')) {
        return;
      }

      if (
        link.target === '_blank' ||
        e.metaKey ||
        e.ctrlKey ||
        e.shiftKey ||
        e.altKey ||
        link.hasAttribute('download')
      ) {
        return;
      }

      if (!navigator.onLine) {
        e.preventDefault();
        hidePageLoader();
        hideInteractionBlocker();
        showGlobalOnly('You are offline. Please reconnect to continue.');
        return;
      }

      e.preventDefault();
      showInteractionBlocker();
      showPageLoader('Loading...');
      window.location.href = href;
    });
  }

  setOtpInputEnabled(false);

  handleProtectedNav(linkUser);
  handleProtectedNav(linkAdmin);

  window.addEventListener('offline', () => {
    hideInteractionBlocker();
    hidePageLoader();
    if (window.OZButtons?.stop) {
      window.OZButtons.stop(getBtn, { keepWidth: true });
      window.OZButtons.stop(verifyBtn, { keepWidth: true });
    }
    refreshActionStates();
  });

  window.addEventListener('online', () => {
    hideInteractionBlocker();
    hidePageLoader();
    hideGlobalError();
    refreshActionStates();

    const v = sanitizeBranch(branchEl.value);
    if (v && validBranch(v)) {
      checkBranch(v);
    }
  });

  window.addEventListener('pageshow', () => {
    hideInteractionBlocker();
    hidePageLoader();
  });

  if (loginForEl) {
    loginForEl.addEventListener('change', () => {
      const opt = loginForEl.options[loginForEl.selectedIndex];
      const email = opt?.dataset.email || "";

      hideGlobalError();
      clearInlinePageError();
      clearStaffLoginError();

      lockEmail(email || '');
      resetOtpUi();
    });
  }

  otpEl.addEventListener('input', () => {
    hideGlobalError();
    otpEl.value = sanitizeOtp(otpEl.value);
    updateVerifyButtonState();
  });

  otpEl.addEventListener('paste', (e) => {
    hideGlobalError();
    e.preventDefault();
    const pasted = e.clipboardData?.getData('text') || '';
    otpEl.value = sanitizeOtp(pasted);
    updateVerifyButtonState();
  });

  otpEl.addEventListener('keydown', (e) => {
    const allowedKeys = ['Backspace', 'Delete', 'Tab', 'ArrowLeft', 'ArrowRight', 'Home', 'End'];
    if (allowedKeys.includes(e.key)) return;
    if (/^\d$/.test(e.key)) return;
    e.preventDefault();
  });

  let checkTimer = null;
  let activeBranchQuery = '';
  const cache = new Map();

  branchEl.addEventListener('keydown', e => {
    if (e.key === ' ') e.preventDefault();
  });

  branchEl.addEventListener('input', () => {
    hideGlobalError();
    clearInlinePageError();
    clearStaffLoginError();

    const before = branchEl.value;
    const after = sanitizeBranch(before);
    if (before !== after) branchEl.value = after;

    activeBranchQuery = after;
    clearCooldown();
    lockEmail('');
    if (window.OZButtons?.stop) {
      window.OZButtons.stop(getBtn, { keepWidth: true });
      window.OZButtons.stop(verifyBtn, { keepWidth: true });
    }
    setGetOtpLabel('Get OTP');
    populateLoginFor([], "");
    resetOtpUi();

    if (!after) {
      setBranchState('idle');
      return;
    }

    if (!validBranch(after)) {
      setBranchState('format_err');
      return;
    }

    setBranchState('checking');
    clearTimeout(checkTimer);
    checkTimer = setTimeout(() => checkBranch(after), 250);
  });

  branchEl.addEventListener('blur', () => {
    branchEl.value = sanitizeBranch(branchEl.value);
    if (branchEl.value) checkBranch(branchEl.value);
  });

  async function checkBranch(name) {
    const q = sanitizeBranch(name);
    activeBranchQuery = q;

    if (!q) {
      setBranchState('idle');
      return;
    }

    if (!validBranch(q)) {
      setBranchState('format_err');
      return;
    }

    if (!navigator.onLine) {
      setBranchState('idle');
      showInlinePageError('No internet connection. Please check your network.');
      refreshActionStates();
      return;
    }

    if (cache.has(q)) {
      if (activeBranchQuery !== q) return;
      applyBranchResult(cache.get(q));
      return;
    }

    const resData = await ApiGuard.get(
      BRANCH_CHECK_URL + "?name=" + encodeURIComponent(q),
      {
        headers: { "Accept": "application/json" },
        suppressGlobalError: true,
        autoRedirect: false
      }
    );

    if (activeBranchQuery !== q) return;

    if (!resData || resData.ok === false) {
      setBranchState('idle');
      showInlinePageError('No internet connection. Please check your network.');
      refreshActionStates();
      return;
    }

    const res = {
      ok: !!(resData.ok && resData.exists),
      email: resData.email || "",
      staff: Array.isArray(resData.staff) ? resData.staff : []
    };

    cache.set(q, res);
    applyBranchResult(res);
  }

  function applyBranchResult(res) {
    if (res.ok) {
      lockEmail(res.email);
      populateLoginFor(res.staff, res.email);
      setBranchState('ok', res.email);
    } else {
      lockEmail('');
      populateLoginFor([], "");
      setBranchState('not_found');
      resetOtpUi();
    }
    refreshActionStates();
  }

  function setBranchState(state, email) {
    branchEl.classList.remove('lg-is-ok', 'lg-is-err');
    branchChip.classList.remove('ok', 'err');

    switch (state) {
      case 'idle':
        branchChip.textContent = 'Not checked';
        branchMsg.textContent = 'Type to check…';
        break;
      case 'checking':
        branchChip.textContent = 'Checking…';
        branchMsg.textContent = 'Looking up branch…';
        break;
      case 'format_err':
        branchEl.classList.add('lg-is-err');
        branchChip.classList.add('err');
        branchChip.textContent = 'Invalid format';
        branchMsg.textContent = 'Use only a–z and 0–9 (no spaces).';
        break;
      case 'ok':
        branchEl.classList.add('lg-is-ok');
        branchChip.classList.add('ok');
        branchChip.textContent = 'Branch found';
        branchMsg.textContent = email ? ('Email on file: ' + maskEmail(email)) : 'Registered branch';
        break;
      case 'not_found':
        branchEl.classList.add('lg-is-err');
        branchChip.classList.add('err');
        branchChip.textContent = 'Not found';
        branchMsg.textContent = 'This branch is not registered.';
        break;
      default:
        branchChip.textContent = 'Not checked';
        branchMsg.textContent = 'Type to check…';
    }

    refreshActionStates();
  }

  getBtn.addEventListener('click', async () => {
    hideGlobalError();
    clearInlinePageError();
    clearStaffLoginError();


    if (otpRequestInFlight || !navigator.onLine) {
      refreshActionStates();
      if (!navigator.onLine) {
        showInlinePageError('No internet connection. Please check your network.');
      }
      return;
    }

    const branch = sanitizeBranch(branchEl.value);
    const codeTo = idEl.dataset.real || '';

    if (!branch){
      showMsg('Enter branch name.', 'lg-err');
      branchEl.focus();
      return;
    }

    if (!codeTo){
      showMsg('No email on file for this branch/staff.', 'lg-err');
      return;
    }

    otpRequestInFlight = true;
    otpSent = false;
    otpEl.value = '';
    setOtpInputEnabled(false);
    refreshActionStates();

    showInteractionBlocker();
    showMsg('Sending OTP…');
    if (window.OZButtons?.start) {
      window.OZButtons.start(getBtn, { keepWidth: true });
    }

    try {
      const res = await ApiGuard.postJson(
        OTP_SEND_URL,
        {
          branch,
          identifier: codeTo,
          target: "email"
        },
        {
          suppressGlobalError: true,
          autoRedirect: false
        }
      );

      if (res && res.ok){
        otpSent = true;
        setOtpInputEnabled(true);
        showMsg(res.message || 'OTP sent to selected email.', 'lg-ok');
        startCooldown();
        updateVerifyButtonState();
        otpEl.focus();
        return;
      }

      otpSent = false;
      setOtpInputEnabled(false);

    const errorMessage = res?.error || res?.message || 'Failed to send OTP.';

    if (res?.error_code === 'offline') {
      showMsg('No internet connection. Please check your network.', 'lg-err');
    } else if (res?.error_code === 'timeout') {
      showMsg('Request timed out. Please try again.', 'lg-err');
    } else if (
      errorMessage.toLowerCase().includes('staff account is inactive')
    ) {
      clearInlinePageError();
      showStaffLoginError(errorMessage);
    } else {
      showMsg(errorMessage, 'lg-err');
    }

    } catch (err) {
      otpSent = false;
      setOtpInputEnabled(false);
      showMsg('Something went wrong while sending OTP.', 'lg-err');
    } finally {
      hideInteractionBlocker();
      otpRequestInFlight = false;
      if (window.OZButtons?.stop) {
        window.OZButtons.stop(getBtn, { keepWidth: true });
      }
      refreshActionStates();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideGlobalError();
    clearInlinePageError();
    clearStaffLoginError();

    if (verifyRequestInFlight) return;

    const branch = sanitizeBranch(branchEl.value);
    const codeTo = idEl.dataset.real || '';
    const code = sanitizeOtp(otpEl.value);
    otpEl.value = code;

    if (!branch){
      showMsg('Enter branch name.', 'lg-err');
      branchEl.focus();
      return;
    }

    if (!codeTo){
      showMsg('No email on file for this branch/staff.', 'lg-err');
      return;
    }

    if (!otpSent) {
      showMsg('Please get OTP first.', 'lg-err');
      getBtn.focus();
      return;
    }

    if (!/^\d{6}$/.test(code)){
      showMsg('Enter a valid 6-digit OTP.', 'lg-err');
      otpEl.focus();
      return;
    }

    if (!navigator.onLine) {
      refreshActionStates();
      showInlinePageError('No internet connection. Please check your network.');
      return;
    }

    let shouldStop = true;
    verifyRequestInFlight = true;
    showInteractionBlocker();
    showMsg('Verifying…');
    if (window.OZButtons?.start) {
      window.OZButtons.start(verifyBtn, { keepWidth: true });
    }
    refreshActionStates();

    try {
      const res = await ApiGuard.postJson(
        OTP_VERIFY_URL,
        {
          branch,
          otp: code,
          identifier: codeTo
        },
        {
          suppressGlobalError: true,
          autoRedirect: false
        }
      );

      if (res && res.ok){
        showMsg(res.message || 'Verified. Redirecting…', 'lg-ok');
        shouldStop = false;
        window.location.replace(res.next || res.redirect_url || '/');
        return;
      }

      if (res?.error_code === 'offline') {
        showMsg('No internet connection. Please check your network.', 'lg-err');
      } else if (res?.error_code === 'timeout') {
        showMsg('Request timed out. Please try again.', 'lg-err');
      } else {
        showMsg(
          res?.error ||
          res?.message ||
          'Invalid OTP. Try again.',
          'lg-err'
        );
      }
    } catch (err) {
      showMsg('Something went wrong while verifying OTP.', 'lg-err');
    } finally {
      if (shouldStop) {
        hideInteractionBlocker();
        verifyRequestInFlight = false;
        if (window.OZButtons?.stop) {
          window.OZButtons.stop(verifyBtn, { keepWidth: true });
        }
        refreshActionStates();
      }
    }
  });

  const pre = new URLSearchParams(location.search).get('b');
  if (pre){
    branchEl.value = sanitizeBranch(pre);
  }

  if (branchEl.value){
    const v = sanitizeBranch(branchEl.value);
    if (v) checkBranch(v);
  } else {
    refreshActionStates();
  }
})();
</script>
</body>
</html>
